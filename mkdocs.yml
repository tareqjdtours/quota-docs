site_name: Quota Dashboard Runbook
theme:
  name: material
  features:
    - navigation.sections
    - search.suggest
    - content.code.copy
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
nav:
  - Start here: index.md
  - Connect to the server: connect.md
  - How staff and clients reach it: reach.md
  - Deploy:
      - First install: deploy/first-install.md
      - How a change goes live: deploy/automatic.md
      - The staging copy: deploy/staging.md
      - Release a new version: deploy/update.md
      - Go back to an earlier version: deploy/rollback.md
  - Maintenance:
      - Health check: maintenance/health-checks.md
      - The office Mac: maintenance/office-mac.md
      - Backups: maintenance/backups.md
      - Passwords and keys: maintenance/secrets.md
  - When it crashes:
      - Site is down: crashes/site-down.md
      - Common errors: crashes/common-errors.md
      - Restore the database: crashes/restore-database.md
      - Server is gone: crashes/server-lost.md
